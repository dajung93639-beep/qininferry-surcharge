<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>부대비용 요율 관리</title>
<style>
  :root{
    --ink:#1f2430; --sub:#5b6270; --line:#e2e4ea; --bg:#f7f7f9; --card:#ffffff;
    --accent:#33427a; --accent-bg:#eaedf6; --brand-red:#c14432; --brand-red-bg:#fbeae7;
    --usd:#8a5a1e; --usd-bg:#fbf1e2; --won:#1e6b4f; --won-bg:#e9f5f0;
  }
  *{box-sizing:border-box;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);margin:0;padding:32px 16px;}
  .wrap{max-width:760px;margin:0 auto;}
  .brand-bar{height:4px;border-radius:4px;background:var(--brand-red);margin-bottom:20px;}
  h1{font-size:19px;font-weight:700;margin:0 0 4px;}
  .sub{color:var(--sub);font-size:13.5px;margin:0 0 20px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:16px;}
  label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px;font-weight:600;}
  input[type=password], input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px;margin-bottom:12px;}
  input[type=number]{width:92px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:13px;text-align:right;}
  .check-row{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);margin-bottom:12px;}
  button{padding:11px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer;}
  button:disabled{opacity:.5;cursor:not-allowed;}
  button:active:not(:disabled){opacity:.85;}
  .btn-row{display:flex;gap:10px;margin-top:16px;}
  .msg{padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:14px;}
  .msg.ok{background:var(--accent-bg);color:var(--accent);}
  .msg.err{background:var(--brand-red-bg);color:var(--brand-red);}
  table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px;}
  th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;}
  th{background:var(--accent);color:#fff;font-size:11px;text-transform:uppercase;letter-spacing:.02em;}
  .badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;}
  .badge.usd{background:var(--usd-bg);color:var(--usd);}
  .badge.won{background:var(--won-bg);color:var(--won);}
  .section-title{font-size:15px;font-weight:700;margin:20px 0 8px;color:var(--accent);}
  .meta-row{display:flex;gap:12px;}
  .meta-row > div{flex:1;}
  #editArea{display:none;}
  .hint{font-size:12px;color:var(--sub);margin-top:6px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand-bar"></div>
  <h1>부대비용 요율 관리</h1>
  <p class="sub">GitHub 개인 액세스 토큰을 입력하면 현재 요율을 불러옵니다. 이 페이지는 토큰을 저장하지 않습니다 (직접 저장을 선택하지 않는 한).</p>

  <div id="msgArea"></div>

  <div class="card">
    <label for="tokenInput">GitHub 개인 액세스 토큰</label>
    <input type="password" id="tokenInput" placeholder="github_pat_로 시작하는 토큰 붙여넣기">
    <div class="check-row">
      <input type="checkbox" id="rememberToken">
      <label for="rememberToken" style="margin:0;font-weight:400;">이 브라우저에 토큰 기억하기 (본인 PC에서만 체크하세요)</label>
    </div>
    <button id="loadBtn" onclick="loadRates()">요율 불러오기</button>
  </div>

  <div id="editArea">
    <div class="card">
      <label>최종 변경자 / 변경일</label>
      <div class="meta-row">
        <div><input type="text" id="lastEditor" placeholder="이름"></div>
        <div><input type="text" id="lastEditDate" placeholder="YYYY-MM-DD"></div>
      </div>
    </div>

    <div id="tablesArea"></div>

    <div class="btn-row">
      <button id="saveBtn" onclick="saveRates()">저장</button>
    </div>
    <p class="hint">저장 시 GitHub 저장소의 rates.json이 즉시 갱신되며, 조회 페이지에 반영됩니다.</p>
  </div>
</div>

<script>
const OWNER = 'dajung93639-beep';
const REPO = 'qininferry-surcharge';
const FILE_PATH = 'rates.json';
const CONTAINER_TYPES = ['20DRY', '40HQ', '20RF', '40RF'];

let currentSha = null;
let currentData = null;

// 저장된 토큰 불러오기 (있다면)
window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('qi_admin_token');
  if(saved){
    document.getElementById('tokenInput').value = saved;
    document.getElementById('rememberToken').checked = true;
  }
});

function showMsg(text, type){
  const el = document.getElementById('msgArea');
  el.innerHTML = `<div class="msg ${type}">${text}</div>`;
}

function getToken(){
  return document.getElementById('tokenInput').value.trim();
}

async function loadRates(){
  const token = getToken();
  if(!token){ showMsg('토큰을 입력해주세요.', 'err'); return; }

  if(document.getElementById('rememberToken').checked){
    localStorage.setItem('qi_admin_token', token);
  } else {
    localStorage.removeItem('qi_admin_token');
  }

  const loadBtn = document.getElementById('loadBtn');
  loadBtn.disabled = true;
  loadBtn.textContent = '불러오는 중...';

  try{
    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`, {
      headers: {
        'Authorization': `Bearer ${token}`,
        'Accept': 'application/vnd.github+json'
      },
      cache: 'no-store'
    });

    if(res.status === 401 || res.status === 403){
      throw new Error('토큰이 유효하지 않거나 권한이 부족합니다.');
    }
    if(!res.ok){
      throw new Error('요율 파일을 불러오지 못했습니다 (상태 코드: ' + res.status + ')');
    }

    const json = await res.json();
    currentSha = json.sha;
    const decoded = decodeURIComponent(escape(atob(json.content.replace(/\n/g, ''))));
    currentData = JSON.parse(decoded);

    document.getElementById('lastEditor').value = currentData.lastEditor || '';
    document.getElementById('lastEditDate').value = currentData.lastEditDate || '';

    renderTables(currentData);
    document.getElementById('editArea').style.display = 'block';
    showMsg('요율을 불러왔습니다. 수정 후 저장 버튼을 눌러주세요.', 'ok');
  } catch(err){
    showMsg(err.message, 'err');
  } finally {
    loadBtn.disabled = false;
    loadBtn.textContent = '요율 불러오기';
  }
}

function renderTables(data){
  const area = document.getElementById('tablesArea');
  area.innerHTML = '';

  [['export','수출'], ['import','수입']].forEach(([mode, label]) => {
    const items = data[mode] || {};
    let html = `<div class="section-title">${label}</div><div class="card"><table><tr><th>항목</th><th>단위</th>`;
    CONTAINER_TYPES.forEach(t => html += `<th>${t}</th>`);
    html += `</tr>`;

    Object.keys(items).forEach(item => {
      const entry = items[item];
      const badgeClass = entry.currency === 'USD' ? 'usd' : 'won';
      html += `<tr>
        <td>${item}<input type="hidden" data-mode="${mode}" data-item="${item}" data-field="currency" value="${entry.currency}"></td>
        <td><span class="badge ${badgeClass}">${entry.currency}</span></td>`;
      CONTAINER_TYPES.forEach(t => {
        html += `<td><input type="number" step="any" data-mode="${mode}" data-item="${item}" data-field="${t}" value="${entry[t] ?? 0}"></td>`;
      });
      html += `</tr>`;
    });

    html += `</table></div>`;
    area.innerHTML += html;
  });
}

function collectFormData(){
  const data = { export: {}, import: {} };

  document.querySelectorAll('#tablesArea input[data-item]').forEach(input => {
    const mode = input.dataset.mode;
    const item = input.dataset.item;
    const field = input.dataset.field;
    if(!data[mode][item]) data[mode][item] = {};

    if(field === 'currency'){
      data[mode][item].currency = input.value;
    } else {
      data[mode][item][field] = parseFloat(input.value) || 0;
    }
  });

  data.lastEditor = document.getElementById('lastEditor').value.trim();
  data.lastEditDate = document.getElementById('lastEditDate').value.trim();
  return data;
}

async function saveRates(){
  const token = getToken();
  if(!token){ showMsg('토큰을 입력해주세요.', 'err'); return; }
  if(!currentSha){ showMsg('먼저 요율을 불러와주세요.', 'err'); return; }

  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;
  saveBtn.textContent = '저장 중...';

  try{
    const updatedData = collectFormData();
    const jsonText = JSON.stringify(updatedData, null, 2);
    const base64Content = btoa(unescape(encodeURIComponent(jsonText)));

    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`, {
      method: 'PUT',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: `요율 업데이트 (${updatedData.lastEditor || '관리자'}, ${updatedData.lastEditDate || ''})`,
        content: base64Content,
        sha: currentSha,
        branch: 'main'
      })
    });

    if(res.status === 401 || res.status === 403){
      throw new Error('토큰이 유효하지 않거나 쓰기 권한이 없습니다.');
    }
    if(res.status === 409){
      throw new Error('다른 곳에서 먼저 저장되었습니다. "요율 불러오기"를 다시 눌러 최신 상태를 확인해주세요.');
    }
    if(!res.ok){
      throw new Error('저장에 실패했습니다 (상태 코드: ' + res.status + ')');
    }

    const result = await res.json();
    currentSha = result.content.sha;
    showMsg('저장되었습니다. 조회 페이지에 곧 반영됩니다.', 'ok');
  } catch(err){
    showMsg(err.message, 'err');
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = '저장';
  }
}
</script>
</body>
</html>
